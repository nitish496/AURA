name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache logic-test jars (android-all, guava)
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: aura-jars-${{ hashFiles('scripts/lib/deps.sh') }}
      - name: Logic tests
        env:
          AURA_REQUIRE_ANDROID_TESTS: '1'
        run: scripts/run-logic-tests.sh
      - name: Assemble and lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  screenshots:
    # Boots a real Android emulator, loads a generated fictional music library,
    # opens each screen via debug-only intent extras and commits the captures to
    # docs/screenshots/. Skip with "[no screenshots]" in the commit message.
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/') && !contains(github.event.head_commit.message, '[no screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: aura-debug-apk
          path: apk
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter python3-pil python3-numpy python3-mutagen
      - name: Generate demo library
        run: python3 scripts/ci/demo_media.py demo-media
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RECORD_VIDEO: ${{ contains(github.event.head_commit.message, '[video]') && '1' || '0' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 6144M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash scripts/ci/screenshots.sh apk demo-media docs/screenshots
      - name: Commit screenshots
        run: |
          python3 scripts/ci/finish_screenshots.py docs/screenshots
          echo "Source commit: ${GITHUB_SHA}" > docs/screenshots/SOURCE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Update emulator screenshots for ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
